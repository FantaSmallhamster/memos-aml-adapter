# MemOS AML adapter: independent HTTPS entry on assigned port 18794.
# Reuse the existing IP certificate and its existing renewal process.
server {
    listen 18794 ssl;
    server_name 192.0.2.10;

    ssl_certificate /etc/letsencrypt/live/memos-aml-adapter/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memos-aml-adapter/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Request metadata only; disable access logging to avoid retaining queries.
    access_log off;
    client_max_body_size 10m;
    client_body_timeout 60s;

    location ~ ^/(add|search|health)$ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }

    location / { return 404; }
}
